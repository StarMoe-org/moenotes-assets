# Set MOENOTES_API_KEY in the environment for administrative HTTP routes, not here.
listen = "127.0.0.1:8091"
data_dir = "data"
region = "hk"
cdn_root = "https://cdn.example.invalid/prod/your-region"
locale = "zh-Hant"
bili_version = "main"
downloads = 8
workers = 2
videos = 1
ffmpeg_threads = 4
queue_limit = 128
max_keys = 50000
temp_bytes = 21474836480
input_bytes = 1073741824
output_bytes = 2147483648
expanded_bytes = 2147483648
memory_threshold = 33554432
worker_memory_bytes = 3221225472
worker_timeout_secs = 900
download_timeout_secs = 120
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"

# This is an asset-format key, not a player credential. Override for other builds.
cri_key = 8594927479
# Test fixtures only. HTTPS remains required for non-loopback hosts.
allow_loopback_http = false

# Optional override for stripped Unity type trees; otherwise use the embedded package.
# class_data = "/path/to/classdata.tpk"

# Optional external browser frontend (exact origins, no trailing slash).
# cors_origins = ["http://localhost:3000"]
# Use ["*"] to allow any origin (without cross-origin credentials).
# locales = ["zh-Hans", "zh-Hant", "en", "ko", "ja"]

# Optional chart site (docs/CHART_SITE.md): the static base package, downloaded once and checked against its sha256
# (or chart_base = a local package / nnnotes `web` directory), and decoded MasterData (<master_root>/<Table>.json).
# chart_base_url = "https://github.com/StarMoe-org/ournotes-player/releases/download/static-base-tw-1.0.1/ournotes-static-base-tw-1.0.1.zip"
# chart_base_sha256 = "ab6ee0103e32812be74e61735a5479b6403ceb624d96613d0e70dbd17b3cca7a"
# master_root = "https://metadata.example.invalid/master"

# Optional version tracking (docs/API.md "Version tracking"): check the metadata service's current_version.json every
# version_poll_secs (0: only POST /versions/check or the CLI `update`). A region whose resource_version or cdnRoot
# changed is refreshed from that cdnRoot and exported in every language; /versions/ then publishes the release and diffs.
# version_url = "https://metadata.example.invalid/current_version.json"
# version_poll_secs = 600

# Optional region array; top-level region must identify a configured entry.
# When omitted, the top-level cdn_root defines the only region.
# [[regions]]
# id = "hk"
# cdn_root = "https://cdn.example.invalid/prod/your-region"
# locale = "zh-Hant"
# locales = ["zh-Hans", "zh-Hant", "en", "ko", "ja"]
# bili_version = "main"
# Entry name in version_url's document (default: id; "" leaves the region untracked).
# metadata_region = "hk-tw-mo"
