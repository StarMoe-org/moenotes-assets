name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: dotnet restore MoenotesAssets.slnx --locked-mode
      - run: dotnet build MoenotesAssets.slnx -c Release --no-restore -warnaserror
      - run: dotnet test MoenotesAssets.slnx -c Release --no-build --logger trx
      - run: dotnet format MoenotesAssets.slnx --verify-no-changes --no-restore
      - run: dotnet publish CSharp/MoenotesAssets.csproj -c Release --no-restore -o artifacts/publish
